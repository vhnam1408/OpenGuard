[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ogk-server"
version = "0.1.0"
description = "OpenGuard Kids enrollment and heartbeat server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "SQLAlchemy>=2.0,<2.1", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26", "uvicorn>=0.30,<1", "tzdata>=2024.1", "pydantic>=2.7,<3",
  "websockets>=14,<16",
  "anyio>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ogk-server = "ogk_server.cli:main"

[tool.setuptools.packages.find]
where = ["src", "../contracts/src"]
include = ["ogk_server*", "ogk_contracts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../contracts/src"]
